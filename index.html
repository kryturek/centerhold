<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Centerhold</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			overflow: hidden;
			user-select: none;
		}

		@font-face {
			/* https://justfreefonts.com/fonts/blocky/ by Maria Mamonova */
			font-family: 'Blocky';
			src: url('./assets/blocky.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}

		.hidden {
			visibility: hidden;
		}

		img {
			-webkit-user-drag: none;
			-khtml-user-drag: none;
			-moz-user-drag: none;
			-o-user-drag: none;

			-webkit-user-select: none;
			-khtml-user-select: none;
			-moz-user-select: none;
			-o-user-select: none;
			user-select: none;
		}   

		#scoreContainer {
			position: fixed;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 120px;
			width: 150px;
			background-color: transparent;
		}

		#score {
			color: white;
			font-family: 'Blocky';
			font-size: 40px;
			opacity: 0.8;

		}

		#upgradeModal {
			position: fixed;
			background-color: white;
			opacity: 0.8;
			color: black;
			font-family: monospace;
			padding: 15px;

			font-size: 16px;

			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 20px;
		}

		.upgradeOption {
			width: 100%;
			height: 100%;
			background-color: rgb(165, 163, 163);
			display: grid;
			justify-items: center;
			align-items: center;
			grid-template-rows: 4fr 1fr;
		}

		.upgradeImage {
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.upgradeOption img {
			max-width: 90%;
			max-height: 100%;
			width: auto;
			height: auto;
			margin: 0 auto;
			object-fit: contain;
		}

		.upgradeOption:hover {
			background-color: rgb(204, 203, 203);
			cursor: pointer;
		}

		#gameOver {
			position: fixed;
			background-color: white;
			visibility: hidden;
			opacity: 0.8;
			color: black;
			font-family: monospace;
			padding: 7px;

			display: grid;
			grid-template-columns: 1fr;
			grid-template-rows: 1fr 3fr 1fr;
			gap: 20px;

			justify-items: center;
			font-size: 14px;
		}

		#gameOverScoreContainer {
			display: flex;
			justify-content: center;
			align-items: center;
			padding-top: 15px;
		}

		#gameOverScore {
			font-family: monospace;
			font-size: 30px;
		}

		#gameOver button {
			/* position: absolute; */
			background-color: black;
			color: white;
			font-family: monospace;
			font-size: 20px;
			padding: 5px;
			width: 100%;
			margin: 0 auto;
		}

		#quoteContainer {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			margin: 0 15px;
		}

		#quote {
			font-style: italic;
			display: block;
			text-align: center;
		}

		#author {
			display: block;
			text-align: center;
		}
	</style>
</head>
<body onContextMenu="return false;">
	<div id="scoreContainer"><span id="score"></span></div>

	<div id="upgradeModal" class="hidden">
	</div>

	<div id="gameOver">
		<div id="gameOverScoreContainer">
			<span id="gameOverScore"></span>
		</div>
		<div id="quoteContainer">
			<span id="quote"></span>
			<span id="author"></span>
		</div>
		<button id="startButton">Start</button>
	</div>
	<canvas></canvas>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js" defer></script>
	<!-- modules are deferred by default -->
	<script type="module" src="./index.js"></script>
</body>
</html>
