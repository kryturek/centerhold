<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Centerhold</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			overflow: hidden;
			user-select: none;
		}

		@font-face {
			font-family: 'Blocky';
			src: url('./blocky.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}

		#scoreContainer {
			position: fixed;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 120px;
			width: 150px;
			background-color: transparent;
		}

		#score {
			color: white;
			font-family: 'Blocky';
			font-size: 40px;
			opacity: 0.8;

		}

		#gameOver {
			position: fixed;
			background-color: white;
			visibility: hidden;
			opacity: 0.8;
			color: black;
			font-family: monospace;
			padding: 7px;

		}

		#gameOver button {
			position: absolute;
			background-color: black;
			color: white;
			font-family: monospace;
			font-size: 20px;
			padding: 5px;
			bottom: 20px;
			width: 70%;
		}
	</style>
</head>
<body>
	<div id="scoreContainer"><span id="score"></span></div>
	<div id="gameOver">
		Score: <span id="gameOverScore"></span>
		<div id="quoteContainer"></div>
		<button>Start</button>
	</div>
	<canvas></canvas>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js" defer></script>
	<!-- modules are deferred by default -->
	<script type="module" src="./index.js"></script>
</body>
</html>
