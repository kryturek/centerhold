<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Centerhold</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			overflow: hidden;
			user-select: none;
		}

		@font-face {
			/* https://justfreefonts.com/fonts/blocky/ by Maria Mamonova */
			font-family: 'Blocky';
			src: url('./assets/blocky.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}

		#scoreContainer {
			position: fixed;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 120px;
			width: 150px;
			background-color: transparent;
		}

		#score {
			color: white;
			font-family: 'Blocky';
			font-size: 40px;
			opacity: 0.8;

		}

		#powerUpContainer {
			position: fixed;
			background-color: white;
			visibility: hidden;
			opacity: 0.8;
			color: black;
			font-family: monospace;
			padding: 7px;

			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 20px;
		}

		.powerUpOption {
			width: 100%;
			height: 100%;
			background-color: rgb(129, 129, 129);
			display: grid;
			justify-items: center;
			align-items: center;
			grid-template-rows: 4fr 1fr;
		}

		.powerUpOption:hover {
			background-color: rgb(150, 150, 150);
			cursor: pointer;
		}

		#gameOver {
			position: fixed;
			background-color: white;
			visibility: hidden;
			opacity: 0.8;
			color: black;
			font-family: monospace;
			padding: 7px;

			display: grid;
			grid-template-columns: 1fr;
			grid-template-rows: 1fr 3fr 1fr;
			gap: 20px;

			justify-items: center;
			font-size: 14px;
		}

		#gameOverScoreContainer {
			display: flex;
			justify-content: center;
			align-items: center;
			padding-top: 15px;
		}

		#gameOverScore {
			font-family: monospace;
			font-size: 30px;
		}

		#gameOver button {
			/* position: absolute; */
			background-color: black;
			color: white;
			font-family: monospace;
			font-size: 20px;
			padding: 5px;
			width: 100%;
			margin: 0 auto;
		}

		#quoteContainer {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			margin: 0 15px;
		}

		#quote {
			font-style: italic;
			display: block;
			text-align: center;
		}

		#author {
			display: block;
			text-align: center;
		}
	</style>
</head>
<body>
	<div id="scoreContainer"><span id="score"></span></div>

	<div id="powerUpContainer">
		<div id="option1" class="powerUpOption">
			<div class="powerUpImage" id="option1Image">
				<img src="./assets/air-staff.webp" alt="">
			</div>
			<div class="powerUpDetails" id="option1details">Damage dealt +2</div>
		</div>
		<div id="option2" class="powerUpOption">
			<div class="powerUpImage" id="option2Image">
				<img src="./assets/air_rune.webp" alt="">
			</div>
			<div class="powerUpDetails" id="option2details">Crit chance +5%</div>

		</div>
	</div>

	<div id="gameOver">
		<div id="gameOverScoreContainer">
			<span id="gameOverScore"></span>
		</div>
		<div id="quoteContainer">
			<span id="quote"></span>
			<span id="author"></span>
		</div>
		<button id="startButton">Start</button>
	</div>
	<canvas></canvas>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js" defer></script>
	<!-- modules are deferred by default -->
	<script type="module" src="./index.js"></script>
</body>
</html>
